        '414': { $ref: '#/components/responses/PreflightProblemResponse' }
        '431': { $ref: '#/components/responses/PreflightProblemResponse' }
        '503': { $ref: '#/components/responses/PreflightOverloadResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OVP-43
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    ClientVersion:
      name: X-OVP-Client-Version
      in: header
      required: true
      schema: { $ref: '#/components/schemas/ClientVersion' }
    ChallengeId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CanonicalUuid' }
    JobId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CanonicalUuid' }
    PackId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PackId' }
    PreflightGetMethod:
      name: Access-Control-Request-Method
      in: header
      required: true
      schema: { type: string, enum: [GET, OPTIONS] }
    PreflightPostMethod:
      name: Access-Control-Request-Method
      in: header
      required: true
      schema: { type: string, enum: [POST, OPTIONS] }
    PreflightGetDeleteMethod:
      name: Access-Control-Request-Method
      in: header
      required: true
      schema: { type: string, enum: [GET, DELETE, OPTIONS] }
    PreflightHeaders:
      name: Access-Control-Request-Headers
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    PreflightPrivateNetwork:
      name: Access-Control-Request-Private-Network
      in: header
      required: false
      schema: { type: string, const: 'true' }
  headers:
    CacheControl:
      required: true
      schema: { type: string, const: no-store }
    NoSniff:
      required: true
      schema: { type: string, const: nosniff }
    RequestId:
      required: true
      schema: { $ref: '#/components/schemas/CanonicalUuid' }
    Location:
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    ETag:
      required: true
      schema: { type: string, minLength: 3, maxLength: 128 }
    ActualAllowOrigin:
      required: false
      x-ovp-condition: validated-origin
      schema: { type: string, minLength: 1, maxLength: 256 }
    ActualExpose:
      required: false
      x-ovp-condition: validated-origin
      schema: { type: string, const: 'ETag, Location, Retry-After, X-Request-Id' }
    ActualVary:
      required: false
      x-ovp-condition: validated-origin
      schema: { type: string, const: Origin }
    PreflightAllowOrigin:
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    PreflightAllowMethods:
      required: true
      schema: { type: string, const: 'GET, POST, DELETE, OPTIONS' }
    PreflightAllowHeaders:
      required: true
      schema: { type: string, const: 'Authorization, Content-Type, X-OVP-Client-Version' }
    PreflightMaxAge:
      required: true
      schema: { type: integer, const: 600 }
    PreflightAllowPrivateNetwork:
      required: false
      x-ovp-condition: legacy-private-network-requested
      schema: { type: string, const: 'true' }
    PreflightVary:
      required: true
      schema:
        type: string
        enum:
          - 'Origin, Access-Control-Request-Method, Access-Control-Request-Headers'
          - 'Origin, Access-Control-Request-Method, Access-Control-Request-Headers, Access-Control-Request-Private-Network'
    FailedPreflightVary:
      required: true
      schema:
        type: string
        const: 'Origin, Access-Control-Request-Method, Access-Control-Request-Headers'
    WWWAuthenticate:
      required: true
      schema: { type: string, const: 'Bearer realm="open-voice-companion"' }
    AllowGet:
      required: true
      schema: { type: string, const: 'GET, OPTIONS' }
    AllowPost:
      required: true
      schema: { type: string, const: 'POST, OPTIONS' }
    AllowGetDelete:
      required: true
      schema: { type: string, const: 'GET, DELETE, OPTIONS' }
    RetryAfter:
      required: true
      schema: { type: integer, minimum: 1, maximum: 3600 }
    ConditionalRetryAfter:
      required: false
      x-ovp-condition: queue-full-problem
      schema: { type: integer, minimum: 1, maximum: 3600 }
  responses:
    ProblemResponse:
      description: Safe RFC 9457 problem response.
      headers:
        Access-Control-Allow-Origin: { $ref: '#/components/headers/ActualAllowOrigin' }
        Access-Control-Expose-Headers: { $ref: '#/components/headers/ActualExpose' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/ActualVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnauthorizedResponse:
      description: Safe bearer authentication problem.
      headers:
        Access-Control-Allow-Origin: { $ref: '#/components/headers/ActualAllowOrigin' }
        Access-Control-Expose-Headers: { $ref: '#/components/headers/ActualExpose' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/ActualVary' }
        WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticate' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MethodNotAllowedGetResponse:
      description: Safe method problem for a GET-only route.
      headers:
        Access-Control-Allow-Origin: { $ref: '#/components/headers/ActualAllowOrigin' }
        Access-Control-Expose-Headers: { $ref: '#/components/headers/ActualExpose' }
        Allow: { $ref: '#/components/headers/AllowGet' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/ActualVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MethodNotAllowedPostResponse:
      description: Safe method problem for a POST-only route.
      headers:
        Access-Control-Allow-Origin: { $ref: '#/components/headers/ActualAllowOrigin' }
        Access-Control-Expose-Headers: { $ref: '#/components/headers/ActualExpose' }
        Allow: { $ref: '#/components/headers/AllowPost' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/ActualVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MethodNotAllowedGetDeleteResponse:
      description: Safe method problem for a GET and DELETE route.
      headers:
        Access-Control-Allow-Origin: { $ref: '#/components/headers/ActualAllowOrigin' }
        Access-Control-Expose-Headers: { $ref: '#/components/headers/ActualExpose' }
        Allow: { $ref: '#/components/headers/AllowGetDelete' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/ActualVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimitedResponse:
      description: Safe rate-limit problem with delay seconds.
      headers:
        Access-Control-Allow-Origin: { $ref: '#/components/headers/ActualAllowOrigin' }
        Access-Control-Expose-Headers: { $ref: '#/components/headers/ActualExpose' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        Vary: { $ref: '#/components/headers/ActualVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailableResponse:
      description: Safe unavailable problem with queue-conditioned delay seconds.
      headers:
        Access-Control-Allow-Origin: { $ref: '#/components/headers/ActualAllowOrigin' }
        Access-Control-Expose-Headers: { $ref: '#/components/headers/ActualExpose' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Retry-After: { $ref: '#/components/headers/ConditionalRetryAfter' }
        Vary: { $ref: '#/components/headers/ActualVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreflightProblemResponse:
      description: Safe preflight problem without allow headers.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/FailedPreflightVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreflightMethodNotAllowedGetResponse:
      description: Safe preflight method problem for a GET-only route.
      headers:
        Allow: { $ref: '#/components/headers/AllowGet' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/FailedPreflightVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreflightMethodNotAllowedPostResponse:
      description: Safe preflight method problem for a POST-only route.
      headers:
        Allow: { $ref: '#/components/headers/AllowPost' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/FailedPreflightVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreflightMethodNotAllowedGetDeleteResponse:
      description: Safe preflight method problem for a GET and DELETE route.
      headers:
        Allow: { $ref: '#/components/headers/AllowGetDelete' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/FailedPreflightVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreflightOverloadResponse:
      description: Safe preflight admission-overload problem.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        Vary: { $ref: '#/components/headers/FailedPreflightVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreflightNoContentResponse:
      description: Valid route-aware preflight with no response body.
      headers:
        Access-Control-Allow-Headers: { $ref: '#/components/headers/PreflightAllowHeaders' }
        Access-Control-Allow-Methods: { $ref: '#/components/headers/PreflightAllowMethods' }
        Access-Control-Allow-Origin: { $ref: '#/components/headers/PreflightAllowOrigin' }
        Access-Control-Allow-Private-Network:
          { $ref: '#/components/headers/PreflightAllowPrivateNetwork' }
        Access-Control-Max-Age: { $ref: '#/components/headers/PreflightMaxAge' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/PreflightVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
    HealthOkResponse:
      description: Minimal listener health.
      headers:
        Access-Control-Allow-Origin: { $ref: '#/components/headers/ActualAllowOrigin' }
        Access-Control-Expose-Headers: { $ref: '#/components/headers/ActualExpose' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/ActualVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/HealthResponse' }
    PairingChallengeCreatedResponse:
      description: Pending native approval challenge.
      headers:
        Access-Control-Allow-Origin: { $ref: '#/components/headers/ActualAllowOrigin' }
        Access-Control-Expose-Headers: { $ref: '#/components/headers/ActualExpose' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Location: { $ref: '#/components/headers/Location' }
        Vary: { $ref: '#/components/headers/ActualVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PairingChallengeResponse' }
    RedeemOkResponse:
      description: One-time bearer delivery.
      headers:
        Access-Control-Allow-Origin: { $ref: '#/components/headers/ActualAllowOrigin' }
        Access-Control-Expose-Headers: { $ref: '#/components/headers/ActualExpose' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/ActualVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RedeemResponse' }
    RedeemPendingResponse:
      description: Native pairing decision is still pending.
      headers:
        Access-Control-Allow-Origin: { $ref: '#/components/headers/ActualAllowOrigin' }
        Access-Control-Expose-Headers: { $ref: '#/components/headers/ActualExpose' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        Vary: { $ref: '#/components/headers/ActualVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RedeemPendingResponse' }
    CurrentPairingResponse:
      description: Current bearer-owned pairing metadata.
      headers:
        Access-Control-Allow-Origin: { $ref: '#/components/headers/ActualAllowOrigin' }
        Access-Control-Expose-Headers: { $ref: '#/components/headers/ActualExpose' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        Vary: { $ref: '#/components/headers/ActualVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PairingResponse' }
    PairingRevokedResponse:
