openapi: 3.1.2
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Open Voice Playground Companion API
  version: 1.0.0
  description: Fail-closed local protocol for the optional Windows companion.
x-protocol-major: 1
x-forbidden-name-policy:
  forbiddenLexemes:
    [
      clone,
      cloning,
      upload,
      uploading,
      prompt,
      prompts,
      prompting,
      control,
      controls,
      path,
      paths,
      url,
      urls,
      command,
      commands,
      model,
      models,
      outputname,
      referenceaudio,
    ]
  contextualLexemes:
    [voice, audio, reference, synthesis, speaker, sample, file, input, output, name, remote, local]
  forbiddenPhrases:
    - [reference, audio]
    - [output, name]
servers:
  - url: http://127.0.0.1:17843
tags:
  - name: health
  - name: pairing
  - name: catalog
  - name: jobs
  - name: packs
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [health]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: Minimal listener health.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '426': { $ref: '#/components/responses/ProblemResponse' }
        '429': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
  /v1/pairings/challenges:
    post:
      operationId: createPairingChallenge
      tags: [pairing]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/ClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairingChallengeRequest' }
      responses:
        '201':
          description: Pending native approval challenge.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            Location: { $ref: '#/components/headers/Location' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingChallengeResponse' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
        '413': { $ref: '#/components/responses/ProblemResponse' }
        '426': { $ref: '#/components/responses/ProblemResponse' }
        '429': { $ref: '#/components/responses/ProblemResponse' }
  /v1/pairings/challenges/{id}/redeem:
    parameters:
      - $ref: '#/components/parameters/ChallengeId'
    post:
      operationId: redeemPairingChallenge
      tags: [pairing]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/ClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedeemRequest' }
      responses:
        '200':
          description: One-time bearer delivery.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedeemResponse' }
        '202':
          description: Native pairing decision is still pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedeemPendingResponse' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
        '410': { $ref: '#/components/responses/ProblemResponse' }
        '429': { $ref: '#/components/responses/ProblemResponse' }
  /v1/pairings/current:
    get:
      operationId: getCurrentPairing
      tags: [pairing]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: Current bearer-owned pairing metadata.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
    delete:
      operationId: revokeCurrentPairing
      tags: [pairing]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '204':
          description: Pairing revoked; no bearer is returned.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
  /v1/runtime:
    get:
      operationId: getRuntime
      tags: [catalog]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: Fail-closed runtime state.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '429': { $ref: '#/components/responses/ProblemResponse' }
  /v1/engines:
    get:
      operationId: listEngines
      tags: [catalog]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: Catalog-owned engine state.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EngineListResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
  /v1/voices:
    get:
      operationId: listVoices
      tags: [catalog]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: Exact Pocket preset list.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceListResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
  /v1/packs:
    get:
      operationId: listPacks
      tags: [packs]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: Pack verification state.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackListResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
  /v1/jobs:
    post:
      operationId: createJob
      tags: [jobs]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/ClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCreateRequest' }
      responses:
        '202':
          description: Bounded queued job.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            Location: { $ref: '#/components/headers/Location' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
        '413': { $ref: '#/components/responses/ProblemResponse' }
        '429': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
  /v1/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getJob
      tags: [jobs]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: Bearer-owned job metadata.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
    delete:
      operationId: cancelJob
      tags: [jobs]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '202':
          description: Idempotent cancellation accepted.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
  /v1/jobs/{id}/audio:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getJobAudio
      tags: [jobs]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: Bearer-owned bounded WAV data.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            audio/wav:
              x-maxBodyBytes: 67108864
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
        '410': { $ref: '#/components/responses/ProblemResponse' }
  /v1/packs/{id}/actions:
    parameters:
      - $ref: '#/components/parameters/PackId'
    post:
      operationId: requestPackAction
      tags: [packs]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/ClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackActionRequest' }
      responses:
        '202':
          description: Pending native decision only; no action executes synchronously.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            Location: { $ref: '#/components/headers/Location' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackActionResponse' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
        '429': { $ref: '#/components/responses/ProblemResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OVP-43
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    ClientVersion:
      name: X-OVP-Client-Version
      in: header
      required: true
      schema: { $ref: '#/components/schemas/ClientVersion' }
    ChallengeId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CanonicalUuid' }
    JobId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CanonicalUuid' }
    PackId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PackId' }
  headers:
    CacheControl:
      required: true
      schema: { type: string, const: no-store }
    NoSniff:
      required: true
      schema: { type: string, const: nosniff }
    RequestId:
      required: true
      schema: { $ref: '#/components/schemas/CanonicalUuid' }
    Location:
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    ETag:
      required: true
      schema: { type: string, minLength: 3, maxLength: 128 }
    RetryAfter:
      required: false
      schema: { type: integer, minimum: 1, maximum: 3600 }
  responses:
    ProblemResponse:
      description: Safe RFC 9457 problem response.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    CanonicalUuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      minLength: 36
      maxLength: 36
    CanonicalDateTime:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|\+([01][0-9]|2[0-3]):[0-5][0-9]|-(?!00:00$)([01][0-9]|2[0-3]):[0-5][0-9])$'
      minLength: 20
      maxLength: 35
    ClientLabel:
      type: string
      pattern: '^(?!(.)\1{32,}$)[^\u0000-\u001F\u007F-\u009F\u061C\u200E\u200F\u2028-\u202E\u2066-\u2069<>{}\[\]`]+$'
      minLength: 1
      maxLength: 64
      x-maxUtf8Bytes: 128
    ClientVersion:
      type: string
      pattern: '^1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      minLength: 5
      maxLength: 32
    SynthesisText:
      type: string
      pattern: '^[^\u0000-\u0008\u000E-\u001F]+$'
      minLength: 1
      maxLength: 2000
      x-maxUtf8Bytes: 8000
    Scope:
      type: string
      enum:
        [
          health:read,
          runtime:read,
          synthesis:create,
          jobs:read,
          jobs:cancel,
          audio:read,
          packs:request,
        ]
    ScopeList:
      type: array
      const:
        [
          health:read,
          runtime:read,
          synthesis:create,
          jobs:read,
          jobs:cancel,
          audio:read,
          packs:request,
        ]
      minItems: 7
      maxItems: 7
      uniqueItems: true
      items: { $ref: '#/components/schemas/Scope' }
    OpaqueSecret:
      type: string
      pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
      minLength: 43
      maxLength: 43
    VoiceId:
      type: string
      enum:
        - pocket:alba
        - pocket:estelle
        - pocket:anna
        - pocket:vera
        - pocket:fantine
        - pocket:charles
        - pocket:paul
        - pocket:eponine
        - pocket:azelma
        - pocket:george
        - pocket:mary
        - pocket:jane
        - pocket:michael
        - pocket:eve
        - pocket:bill_boerst
        - pocket:caro_davy
        - pocket:peter_yearsley
        - pocket:stuart_bell
        - pocket:marius
        - pocket:javert
    PackId:
      type: string
      const: pocket-companion-pack
    OperationalState:
      type: string
      const: pack-unverified
    ProblemCode:
      type: string
      enum:
        - host-invalid
        - origin-missing
        - origin-denied
        - version-missing
        - version-unsupported
        - auth-missing
        - auth-invalid
        - auth-origin-mismatch
        - scope-denied
        - rate-limited
        - request-line-too-large
        - headers-too-large
        - body-too-large
        - body-timeout
        - header-timeout
        - schema-invalid
        - queue-full
        - ownership-denied
        - resource-not-found
        - conflict
        - handler-timeout
        - listener-conflict
        - pairing-not-found
        - pairing-denied
        - pairing-expired
        - pairing-consumed
        - pairing-attempts-exhausted
        - pack-unverified
        - runtime-unavailable
        - method-not-allowed
        - content-type-unsupported
        - transfer-encoding-invalid
        - duplicate-header
        - text-invalid
        - action-invalid
    Problem:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, title, status, detail, instance, code, requestId]
          properties:
            type: { type: string, const: 'urn:ovp:problem:host-invalid' }
            title: { type: string, const: 'Request rejected' }
            status: { type: integer, const: 400 }
            detail:
              { type: string, const: 'The request Host is not the companion loopback authority.' }
            instance:
              {
                type: string,
                pattern: '^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$',
                minLength: 45,
                maxLength: 45,
              }
            code: { type: string, const: 'host-invalid' }
            requestId: { $ref: '#/components/schemas/CanonicalUuid' }
        - type: object
          additionalProperties: false
          required: [type, title, status, detail, instance, code, requestId]
          properties:
            type: { type: string, const: 'urn:ovp:problem:origin-missing' }
            title: { type: string, const: 'Request rejected' }
            status: { type: integer, const: 400 }
            detail: { type: string, const: 'The Origin header is required.' }
            instance:
              {
                type: string,
                pattern: '^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$',
                minLength: 45,
                maxLength: 45,
              }
            code: { type: string, const: 'origin-missing' }
            requestId: { $ref: '#/components/schemas/CanonicalUuid' }
        - type: object
          additionalProperties: false
          required: [type, title, status, detail, instance, code, requestId]
          properties:
            type: { type: string, const: 'urn:ovp:problem:origin-denied' }
            title: { type: string, const: 'Origin denied' }
            status: { type: integer, const: 403 }
            detail: { type: string, const: 'The requesting origin is not allowed.' }
            instance:
              {
                type: string,
                pattern: '^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$',
                minLength: 45,
                maxLength: 45,
              }
            code: { type: string, const: 'origin-denied' }
            requestId: { $ref: '#/components/schemas/CanonicalUuid' }
        - type: object
          additionalProperties: false
          required: [type, title, status, detail, instance, code, requestId]
          properties:
            type: { type: string, const: 'urn:ovp:problem:version-missing' }
            title: { type: string, const: 'Request rejected' }
            status: { type: integer, const: 400 }
            detail: { type: string, const: 'The client version header is required.' }
            instance:
              {
                type: string,
                pattern: '^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$',
                minLength: 45,
                maxLength: 45,
              }
            code: { type: string, const: 'version-missing' }
            requestId: { $ref: '#/components/schemas/CanonicalUuid' }
        - type: object
          additionalProperties: false
          required: [type, title, status, detail, instance, code, requestId]
          properties:
            type: { type: string, const: 'urn:ovp:problem:version-unsupported' }
            title: { type: string, const: 'Request rejected' }
            status: { type: integer, const: 426 }
            detail: { type: string, const: 'The client protocol major is not supported.' }
            instance:
              {
                type: string,
                pattern: '^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$',
                minLength: 45,
                maxLength: 45,
              }
            code: { type: string, const: 'version-unsupported' }
            requestId: { $ref: '#/components/schemas/CanonicalUuid' }
        - type: object
          additionalProperties: false
          required: [type, title, status, detail, instance, code, requestId]
          properties:
            type: { type: string, const: 'urn:ovp:problem:auth-missing' }
            title: { type: string, const: 'Authentication failed' }
            status: { type: integer, const: 401 }
            detail: { type: string, const: 'A bearer token is required.' }
            instance:
              {
                type: string,
