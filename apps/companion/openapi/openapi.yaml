        '405': { $ref: '#/components/responses/MethodNotAllowedGetResponse' }
        '408': { $ref: '#/components/responses/ProblemResponse' }
        '413': { $ref: '#/components/responses/ProblemResponse' }
        '414': { $ref: '#/components/responses/ProblemResponse' }
        '426': { $ref: '#/components/responses/ProblemResponse' }
        '429': { $ref: '#/components/responses/RateLimitedResponse' }
        '431': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ServiceUnavailableResponse' }
        '504': { $ref: '#/components/responses/ProblemResponse' }
