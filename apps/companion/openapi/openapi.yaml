openapi: 3.1.2
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Open Voice Playground Companion API
  version: 1.0.0
  description: Fail-closed local protocol for the optional Windows companion.
x-protocol-major: 1
x-forbidden-name-policy:
  forbiddenLexemes:
    [
      clone,
      cloning,
      upload,
      uploading,
      prompt,
      prompts,
      prompting,
      control,
      controls,
      path,
      paths,
      url,
      urls,
      command,
      commands,
      model,
      models,
      outputname,
      referenceaudio,
    ]
  contextualLexemes:
    [voice, audio, reference, synthesis, speaker, sample, file, input, output, name, remote, local]
  forbiddenPhrases:
    - [reference, audio]
    - [output, name]
x-ovp-http-policy:
  version: 1
  allowedOriginSource: compiled-exact-allowlist
  credentials: prohibited
  actual:
    allowOrigin: validated-origin
    exposeHeaders: [ETag, Location, Retry-After, X-Request-Id]
    vary: [Origin]
  preflight:
    allowMethods: [GET, POST, DELETE, OPTIONS]
    allowHeaders: [Authorization, Content-Type, X-OVP-Client-Version]
    maxAgeSeconds: 600
    requestedHeaderComparison: ascii-case-insensitive-exact-set
    requiresDeclaredConcreteTarget: true
    rejectsBody: true
    rejectsCredentials: true
    rejectsOptionsTarget: true
    failureMap:
      admission-overload: { status: 503, code: queue-full }
      denied-origin: { status: 403, code: origin-denied }
      duplicate-preflight-header: { status: 400, code: duplicate-header }
      header-timeout: { status: 408, code: header-timeout }
      headers-too-large: { status: 431, code: headers-too-large }
      invalid-preflight-shape: { status: 400, code: schema-invalid }
      missing-origin: { status: 400, code: origin-missing }
      oversize-body: { status: 413, code: body-too-large }
      request-line-too-large: { status: 414, code: request-line-too-large }
      unsupported-route-method: { status: 405, code: method-not-allowed }
    legacyPrivateNetwork:
      requestHeader: Access-Control-Request-Private-Network
      requestValue: 'true'
      responseHeader: Access-Control-Allow-Private-Network
      responseValue: 'true'
      varyToken: Access-Control-Request-Private-Network
      emitIffRequested: true
  unknownRoute: { status: 404, code: resource-not-found }
  retryAfter:
    kind: delay-seconds
    minimum: 1
    maximum: 3600
    httpDateAllowed: false
    queueFullProblemCode: queue-full
    queueFullResponseCondition: queue-full-problem
  problemCodes:
    http:
      - host-invalid
      - origin-missing
      - origin-denied
      - version-missing
      - version-unsupported
      - auth-missing
      - auth-invalid
      - auth-origin-mismatch
      - scope-denied
      - rate-limited
      - request-line-too-large
      - headers-too-large
      - body-too-large
      - body-timeout
      - header-timeout
      - schema-invalid
      - queue-full
      - ownership-denied
      - resource-not-found
      - conflict
      - handler-timeout
      - pairing-not-found
      - pairing-denied
      - pairing-expired
      - pairing-consumed
      - pairing-attempts-exhausted
      - pack-unverified
      - runtime-unavailable
      - method-not-allowed
      - content-type-unsupported
      - transfer-encoding-invalid
      - duplicate-header
      - text-invalid
      - action-invalid
    nonHttp: [listener-conflict]
  accessByOperation:
    getHealth: { auth: origin-only, scope: null, ownership: none }
    createPairingChallenge: { auth: origin-only, scope: null, ownership: none }
    redeemPairingChallenge: { auth: origin-only, scope: null, ownership: none }
    getCurrentPairing: { auth: bearer, scope: null, ownership: token-self }
    revokeCurrentPairing: { auth: bearer, scope: null, ownership: token-self }
    getRuntime: { auth: bearer, scope: 'runtime:read', ownership: none }
    listEngines: { auth: bearer, scope: 'runtime:read', ownership: none }
    listVoices: { auth: bearer, scope: 'runtime:read', ownership: none }
    listPacks: { auth: bearer, scope: 'runtime:read', ownership: none }
    createJob: { auth: bearer, scope: 'synthesis:create', ownership: none }
    getJob: { auth: bearer, scope: 'jobs:read', ownership: job-owner }
    cancelJob: { auth: bearer, scope: 'jobs:cancel', ownership: job-owner }
    getJobAudio: { auth: bearer, scope: 'audio:read', ownership: job-owner }
    requestPackAction: { auth: bearer, scope: 'packs:request', ownership: none }
servers:
  - url: http://127.0.0.1:17843
tags:
  - name: health
  - name: pairing
  - name: catalog
  - name: jobs
  - name: packs
