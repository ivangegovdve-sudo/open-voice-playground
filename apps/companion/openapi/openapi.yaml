      type: string
      format: date-time
      pattern: '^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]{1,9})?(Z|\+([01][0-9]|2[0-3]):[0-5][0-9]|-(?!00:00$)([01][0-9]|2[0-3]):[0-5][0-9])$'
      minLength: 20
      maxLength: 35
    ClientLabel:
      type: string
      pattern: '^(?!(.)\1{32,}$)[^\u0000-\u001F\u007F-\u009F\u061C\u200E\u200F\u2028-\u202E\u2066-\u2069<>{}\[\]`]+$'
      minLength: 1
      maxLength: 64
      x-maxUtf8Bytes: 128
    ClientVersion:
      type: string
      pattern: '^1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      minLength: 5
      maxLength: 32
    SynthesisText:
      type: string
      pattern: '^[^\u0000-\u0008\u000E-\u001F]+$'
      minLength: 1
      maxLength: 2000
      x-maxUtf8Bytes: 8000
    Scope:
      type: string
      enum:
        [
          health:read,
          runtime:read,
          synthesis:create,
          jobs:read,
          jobs:cancel,
          audio:read,
          packs:request,
        ]
    ScopeList:
      type: array
      const:
        [
          health:read,
          runtime:read,
          synthesis:create,
          jobs:read,
          jobs:cancel,
          audio:read,
          packs:request,
        ]
      minItems: 7
      maxItems: 7
      uniqueItems: true
      items: { $ref: '#/components/schemas/Scope' }
    OpaqueSecret:
      type: string
      pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
      minLength: 43
      maxLength: 43
