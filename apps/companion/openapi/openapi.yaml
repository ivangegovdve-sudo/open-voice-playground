    HealthResponse:
      type: object
      additionalProperties: false
      required: [app, protocolMajor, listenerState]
      properties:
        app: { type: string, const: open-voice-companion }
        protocolMajor: { type: integer, const: 1 }
        listenerState: { type: string, enum: [listening, listener-conflict] }
    DeepLinkChallengeRequest:
      type: object
      additionalProperties: false
      required: [state, verifierHash, clientLabel, scopes]
      properties:
        state: { $ref: '#/components/schemas/OpaqueSecret' }
        verifierHash: { $ref: '#/components/schemas/OpaqueSecret' }
        clientLabel: { $ref: '#/components/schemas/ClientLabel' }
        scopes: { $ref: '#/components/schemas/ScopeList' }
    ManualChallengeRequest:
      type: object
      additionalProperties: false
      required: [code, verifierHash, clientLabel, scopes]
      properties:
        code: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{12}$', minLength: 12, maxLength: 12 }
        verifierHash: { $ref: '#/components/schemas/OpaqueSecret' }
        clientLabel: { $ref: '#/components/schemas/ClientLabel' }
        scopes: { $ref: '#/components/schemas/ScopeList' }
    PairingChallengeRequest:
      oneOf:
        - $ref: '#/components/schemas/DeepLinkChallengeRequest'
        - $ref: '#/components/schemas/ManualChallengeRequest'
    PairingChallengeResponse:
      type: object
      additionalProperties: false
      required: [id, state, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/CanonicalUuid' }
        state: { type: string, const: pending }
        expiresAt: { $ref: '#/components/schemas/CanonicalDateTime' }
    RedeemRequest:
      type: object
      additionalProperties: false
      required: [verifier]
      properties:
        verifier: { $ref: '#/components/schemas/OpaqueSecret' }
    RedeemPendingResponse:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, const: pending }
    RedeemResponse:
      type: object
      additionalProperties: false
      required: [token, pairing]
      properties:
        token: { $ref: '#/components/schemas/OpaqueSecret' }
        pairing: { $ref: '#/components/schemas/PairingResponse' }
    PairingResponse:
      type: object
      additionalProperties: false
      required: [id, clientLabel, scopes, createdAt, lastUsedAt]
      properties:
        id: { $ref: '#/components/schemas/CanonicalUuid' }
        clientLabel: { $ref: '#/components/schemas/ClientLabel' }
        scopes: { $ref: '#/components/schemas/ScopeList' }
        createdAt: { $ref: '#/components/schemas/CanonicalDateTime' }
        lastUsedAt: { $ref: '#/components/schemas/CanonicalDateTime' }
    RuntimeResponse:
      type: object
      additionalProperties: false
      required: [engineId, state, operational, reason]
      properties:
        engineId: { type: string, const: pocket }
        state: { $ref: '#/components/schemas/OperationalState' }
        operational: { type: boolean, const: false }
        reason: { type: string, const: pack-unverified }
    EngineResponse:
      type: object
      additionalProperties: false
      required: [id, state, operational]
      properties:
        id: { type: string, const: pocket }
        state: { type: string, const: pack-unverified }
        operational: { type: boolean, const: false }
    EngineListResponse:
      type: object
      additionalProperties: false
      required: [engines]
      properties:
        engines:
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: '#/components/schemas/EngineResponse' }
    VoiceResponse:
      type: object
      additionalProperties: false
      required: [id, engineId, availableInPack, operational]
      properties:
        id: { $ref: '#/components/schemas/VoiceId' }
        engineId: { type: string, const: pocket }
        availableInPack: { type: boolean, const: true }
        operational: { type: boolean, const: false }
    VoiceListResponse:
      type: object
      additionalProperties: false
      required: [voices]
      properties:
        voices:
          type: array
          minItems: 20
          maxItems: 20
          uniqueItems: true
          items: { $ref: '#/components/schemas/VoiceResponse' }
    PackResponse:
      type: object
      additionalProperties: false
      required: [id, state, verified, operational]
      properties:
        id: { $ref: '#/components/schemas/PackId' }
        state: { type: string, const: pack-unverified }
        verified: { type: boolean, const: false }
        operational: { type: boolean, const: false }
    PackListResponse:
      type: object
      additionalProperties: false
      required: [packs]
      properties:
        packs:
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: '#/components/schemas/PackResponse' }
    JobCreateRequest:
      type: object
      additionalProperties: false
      required: [voiceId, text]
      properties:
        voiceId: { $ref: '#/components/schemas/VoiceId' }
        text: { $ref: '#/components/schemas/SynthesisText' }
    JobResponse:
      type: object
      additionalProperties: false
      required: [id, voiceId, state, audioAvailable, createdAt]
      properties:
        id: { $ref: '#/components/schemas/CanonicalUuid' }
        voiceId: { $ref: '#/components/schemas/VoiceId' }
        state: { type: string, enum: [queued, cancelling, cancelled, failed, expired] }
        audioAvailable: { type: boolean, const: false }
        createdAt: { $ref: '#/components/schemas/CanonicalDateTime' }
    PackActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [install, update, repair, remove] }
    PackActionResponse:
      type: object
      additionalProperties: false
      required: [id, packId, action, state]
      properties:
        id: { $ref: '#/components/schemas/CanonicalUuid' }
        packId: { $ref: '#/components/schemas/PackId' }
        action: { type: string, enum: [install, update, repair, remove] }
        state: { type: string, const: pending-native-decision }
